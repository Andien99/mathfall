<!doctype html><html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="/css/fonts.css">
<style>body{background:#16142a;color:#eee;font:13px "Alegreya Sans",sans-serif;margin:12px} h2{font-size:14px;margin:12px 0 4px;color:#e8b85a}
.g{display:flex;flex-wrap:wrap;gap:6px}.c{width:96px;text-align:center;padding:4px;border-radius:6px;border:2px solid var(--rc);background:#221f3d}
.c img{width:54px;height:54px;image-rendering:pixelated;display:block;margin:0 auto}</style></head><body>
<div id="out"></div>
<script src="/shared/content.js"></script>
<script type="module">
import * as SP from '/js/sprites.js';
const C = window.MF_Content, out = document.getElementById('out');
const sec = (title, list) => { const h = document.createElement('h2'); h.textContent = title; const g = document.createElement('div'); g.className = 'g';
  for (const [name, icon, rar] of list) { const d = document.createElement('div'); d.className = 'c'; d.style.setProperty('--rc', C.RARITY[rar].color); d.innerHTML = `<img src="${SP.iconURL(icon, 3)}"><div>${name}</div>`; g.append(d); }
  out.append(h, g); };
for (const cls of C.HERO_ORDER) sec(C.HEROES[cls].name, C.classSkills(cls).map(id => [C.SKILLS[id].name, C.SKILLS[id].icon, C.SKILLS[id].rarity]));
sec('Items', Object.values(C.ITEMS).map(i => [i.name, i.icon, i.rarity]));
</script></body></html>
